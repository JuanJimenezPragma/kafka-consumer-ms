server:
  port: 8080
spring:
  application:
    name: "kafka-consumer-ms"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
reactive:
  commons:
    kafka:
      app:
        connection-properties:
          security:
            protocol: "${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}"
          consumer:
            group-id: "${KAFKA_CONSUMER_GROUP_ID:kafka-consumer-ms}"
        withDLQRetry: "${APP_ASYNC_WITH_DLQ_RETRY:true}"
        maxRetries: "${APP_ASYNC_MAX_RETRIES:5}"
        retryDelay: "${APP_ASYNC_RETRY_DELAY:1000}"
